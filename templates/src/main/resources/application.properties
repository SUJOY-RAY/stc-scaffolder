spring.application.name=__ARTIFACT__
server.port=8080

# -----------------------------------------------------------------------------
# JWT (common to all environments)
# -----------------------------------------------------------------------------
jwt.secret=__JWT__
jwt.expiration=86400000

# -----------------------------------------------------------------------------
# JPA (common)
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Profile groups (activate with --spring.profiles.active=<group>)
#   dev          -> dev + H2 (default, no database server needed)
#   dev-mysql    -> dev + MySQL
#   qa           -> QA + MySQL
#   prod         -> Prod + MySQL
# -----------------------------------------------------------------------------
# Default active profile (dev + H2) — runs with no database server
spring.profiles.active=dev

spring.profiles.group.dev=dev-common,dev-h2
spring.profiles.group.dev-mysql=dev-common,dev-mysql
spring.profiles.group.qa=qa-common,qa
spring.profiles.group.prod=prod-common,prod
